services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - bracc
    depends_on:
      - api
      - frontend

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
    volumes:
      - neo4j-data:/data
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/init.cypher:/var/lib/neo4j/init.cypher
    networks:
      - bracc
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      PUBLIC_MODE: ${PUBLIC_MODE:-false}
      PUBLIC_ALLOW_PERSON: ${PUBLIC_ALLOW_PERSON:-false}
      PUBLIC_ALLOW_ENTITY_LOOKUP: ${PUBLIC_ALLOW_ENTITY_LOOKUP:-false}
      PUBLIC_ALLOW_INVESTIGATIONS: ${PUBLIC_ALLOW_INVESTIGATIONS:-false}
      PATTERNS_ENABLED: ${PATTERNS_ENABLED:-false}
      PRODUCT_TIER: ${PRODUCT_TIER:-community}
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      INVITE_CODE: ${INVITE_CODE:-}
      CORS_ORIGINS: https://${DOMAIN}
      AUTH_COOKIE_SECURE: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - bracc
    depends_on:
      neo4j:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "/app/api-readiness.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_PUBLIC_MODE: ${PUBLIC_MODE:-false}
        VITE_PATTERNS_ENABLED: ${PATTERNS_ENABLED:-false}
    restart: unless-stopped
    networks:
      - bracc
    depends_on:
      - api

networks:
  bracc:
    driver: bridge

volumes:
  neo4j-data:
  caddy-data:
  caddy-config:
