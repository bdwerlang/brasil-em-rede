services:
  neo4j:
    container_name: bracc-neo4j
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 3G
      NEO4J_dbms_memory_transaction_total_max: 1G
    volumes:
      - neo4j-data:/data
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/init.cypher:/var/lib/neo4j/init.cypher
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      PUBLIC_MODE: ${PUBLIC_MODE:-false}
      PUBLIC_ALLOW_PERSON: ${PUBLIC_ALLOW_PERSON:-false}
      PUBLIC_ALLOW_ENTITY_LOOKUP: ${PUBLIC_ALLOW_ENTITY_LOOKUP:-false}
      PUBLIC_ALLOW_INVESTIGATIONS: ${PUBLIC_ALLOW_INVESTIGATIONS:-false}
      PATTERNS_ENABLED: ${PATTERNS_ENABLED:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PRODUCT_TIER: ${PRODUCT_TIER:-community}
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "/app/api-readiness.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_PUBLIC_MODE: ${PUBLIC_MODE:-false}
        VITE_PATTERNS_ENABLED: ${PATTERNS_ENABLED:-false}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  etl:
    build: ../etl
    profiles: ["etl"]
    working_dir: /workspace
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ..:/workspace
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:
