name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.24.2
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${VERSION}_checksums.txt"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${CHECKSUMS}"
          grep "  ${ARCHIVE}$" "$CHECKSUMS" | sha256sum --check --strict
          tar -xzf "$ARCHIVE" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run gitleaks
        run: gitleaks git . --no-banner --redact --gitleaks-ignore-path .gitleaksignore

  bandit:
    name: Bandit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: python -m pip install --upgrade pip bandit

      - name: Run bandit
        run: |
          bandit -r api/src etl/src scripts \
            -x api/tests,etl/tests \
            -lll -iii

  pip-audit:
    name: Pip Audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [api, etl]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export locked dependencies, including optional features
        run: >-
          uv export --locked --all-extras --all-groups
          --format requirements-txt --no-hashes --no-emit-project --no-emit-local
          --output-file audit-requirements.txt

      - name: Audit dependencies
        run: >-
          uvx pip-audit==2.10.1 -r audit-requirements.txt --strict
          --format json --output audit-report.json

      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-${{ matrix.project }}
          path: |
            ${{ matrix.project }}/audit-requirements.txt
            ${{ matrix.project }}/audit-report.json
          if-no-files-found: error

  npm-audit:
    name: NPM Audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Audit frontend dependencies
        run: cd frontend && npm audit --audit-level=high

  public-privacy-gate:
    name: Public Privacy Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate public privacy contract
        run: python scripts/check_public_privacy.py --repo-root .

  compliance-pack-gate:
    name: Compliance Pack Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate legal and ethics baseline
        run: python scripts/check_compliance_pack.py --repo-root .

  public-boundary-gate:
    name: Public Boundary Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate public edition scope
        run: python scripts/check_open_core_boundary.py --repo-root .

  internal-instruction-boundary:
    name: Internal Instruction Boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure internal assistant files are not tracked
        run: |
          if git ls-files | grep -E '(^|/)(CLAUDE\.md|AGENTS.*\.md)$'; then
            echo "Forbidden tracked files found: CLAUDE.md / AGENTS*.md"
            exit 1
          fi
