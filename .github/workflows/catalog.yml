name: Source Catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Catalog and implementation plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/generate_source_implementation_plan.py --check
      - run: python scripts/generate_data_sources_summary.py --check
      - run: python scripts/check_public_claims.py --repo-root .
      - run: python scripts/check_pipeline_contracts.py
      - run: python scripts/check_pipeline_inputs.py
      - run: git diff --check
